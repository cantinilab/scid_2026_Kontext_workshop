# scid_2026_workshop/environment.yml
name: kontext
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # core numeric
  - numpy<2.2
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - numba>=0.59          # used by _sparse_pairwise_dists
  - pynndescent          # knn_indices(approx=True)
  - psutil               # Profiler
  # single-cell / spatial
  - anndata>=0.10
  - scanpy>=1.10
  - h5py                 # read_h5ad
  # plotting
  - matplotlib-base
  - seaborn
  - umap-learn           # notebook: from umap.umap_ import UMAP
  # notebook
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm
  - pip:
      - liana            # utils.py: import liana as li  (not reliably on conda-forge)